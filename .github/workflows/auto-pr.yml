name: Auto PR
on:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir PR para main se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Já existe um PR aberto para $BRANCH."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --draft \
            --title "$BRANCH" \
            --body "PR aberto automaticamente pelo workflow Auto PR para as alterações da branch \`$BRANCH\`."
