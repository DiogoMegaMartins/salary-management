name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # Deteta commits só de documentação. Os jobs abaixo ficam "skipped" (conta como verde nas verificações
  # obrigatórias e não gasta minutos), em vez de não existirem como com `paths-ignore`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          docs_only=false
          worker=true # sem comparação possível (ex.: ramo novo), corre tudo
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$AFTER" | grep -Ev '\.md$|^docs/' || true)
            [ -z "$other" ] && docs_only=true
            # o teste do Worker só interessa se mudou algo que corre no Worker (servidor, cálculos, configuração, dependências)
            if git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^(worker/|server/|shared/|e2e/|wrangler\.jsonc|package(-lock)?\.json|tsconfig|playwright\.config|\.github/workflows/ci\.yml)'; then worker=true; else worker=false; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only worker=$worker"
  check:
    name: check
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:worker
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Arranque em produção (smoke test)
        env:
          NODE_ENV: production
          PORT: "5055"
          DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          mkdir -p "$DATA_DIR"
          node dist/index.cjs &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5055/api/health | grep -q '"ok":true'; then
              echo "Saúde OK"; kill $pid; exit 0
            fi
            sleep 1
          done
          echo "A app não respondeu em /api/health" >&2
          kill $pid || true
          exit 1
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Na main (depois do merge) corre tudo. Nos ramos, o computador completo e, no telemóvel, só o essencial
      # (acesso, navegação e interface): poupa cerca de 1,5 min por push sem perder os erros de layout mais comuns.
      - name: Interface (completa na main)
        if: github.ref == 'refs/heads/main'
        run: npm run test:e2e
      - name: Interface (reduzida nos ramos)
        if: github.ref != 'refs/heads/main'
        run: |
          npx playwright test --project=desktop
          npx playwright test --project=telemovel e2e/acesso.spec.ts e2e/navegacao.spec.ts e2e/interface.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # A mesma bateria de interface, só em computador, contra o Worker da Cloudflare (workerd em local).
  # Só corre se mudou algo que corre no Worker (servidor, cálculos, configuração, dependências).
  e2e-worker:
    name: e2e-worker
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e:worker
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-worker
          path: |
            playwright-report/
            test-results/
          retention-days: 7
