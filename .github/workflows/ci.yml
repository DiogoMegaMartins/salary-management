name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Arranque em produção (smoke test)
        env:
          NODE_ENV: production
          PORT: "5055"
          DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          mkdir -p "$DATA_DIR"
          node dist/index.cjs &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5055/api/health | grep -q '"ok":true'; then
              echo "Saúde OK"; kill $pid; exit 0
            fi
            sleep 1
          done
          echo "A app não respondeu em /api/health" >&2
          kill $pid || true
          exit 1
