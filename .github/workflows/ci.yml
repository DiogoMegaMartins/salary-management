name: CI
on:
  push:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # Deteta commits só de documentação. Os jobs abaixo ficam "skipped" (conta como verde nas verificações
  # obrigatórias e não gasta minutos), em vez de não existirem como com `paths-ignore`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          docs_only=false
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$AFTER" | grep -Ev '\.md$|^docs/' || true)
            [ -z "$other" ] && docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
  check:
    name: check
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:worker
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Arranque em produção (smoke test)
        env:
          NODE_ENV: production
          PORT: "5055"
          DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          mkdir -p "$DATA_DIR"
          node dist/index.cjs &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5055/api/health | grep -q '"ok":true'; then
              echo "Saúde OK"; kill $pid; exit 0
            fi
            sleep 1
          done
          echo "A app não respondeu em /api/health" >&2
          kill $pid || true
          exit 1
  # Interface (Playwright) contra o Worker da Cloudflare em local (workerd): é o que corre em produção.
  # Nos ramos: computador completo e, no telemóvel, só o essencial (acesso, navegação e interface).
  # Na main (depois do merge): computador e telemóvel completos.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TARGET: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Interface completa (main)
        if: github.ref == 'refs/heads/main'
        run: npx playwright test
      - name: Interface reduzida (ramos)
        if: github.ref != 'refs/heads/main'
        run: |
          npx playwright test --project=desktop
          npx playwright test --project=telemovel e2e/acesso.spec.ts e2e/navegacao.spec.ts e2e/interface.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # O servidor Node (Express) também é suportado (correr em local, Docker): só se testa na main, depois do merge.
  e2e-node:
    name: e2e-node
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-node
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Deploy automático (opcional): dispara o workflow "Deploy (Cloudflare)" depois do merge, só se tudo passou e
  # se existir a variável de repositório AUTO_DEPLOY = true. Sem a variável, este job fica "skipped" e nada é
  # disparado. O deploy espera pela aprovação do ambiente "production" (Required reviewers).
  auto-deploy:
    name: auto-deploy
    needs: [check, test, build, e2e, e2e-node]
    if: >-
      github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true' &&
      needs.check.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' &&
      needs.e2e.result == 'success' && needs.e2e-node.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Disparar o Deploy (Cloudflare) para este commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main -f sha=${{ github.sha }}
