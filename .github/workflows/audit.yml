name: Audit
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
