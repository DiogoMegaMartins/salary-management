name: Deploy (Cloudflare)
# À mão: Actions > Deploy (Cloudflare) > Run workflow.
# Automático (opcional): o CI (ci.yml) dispara este workflow no fim, depois do merge para a main, mas SÓ se existir a
# variável do repositório AUTO_DEPLOY = true (Settings > Secrets and variables > Actions > Variables). Sem a variável
# (ou com outro valor), nada é disparado e este workflow nem aparece em Actions. Só a ativa depois de o ambiente
# "production" ter "Required reviewers" (Settings > Environments > production): é isso que faz o deploy esperar
# pela tua aprovação.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit a publicar (vazio = o mais recente da branch escolhida). O CI preenche-o no deploy automático."
        required: false
        default: ""
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://salary-management.private-finances.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          # no deploy automático publica exatamente o commit que o CI validou; à mão, o último da branch escolhida
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        shell: bash # com pipefail: se o deploy falhar, o passo falha mesmo com o tee
        run: npm run deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Confirma que o Worker publicado responde (o objeto pode demorar uns segundos a arrancar).
      - name: Verificar /api/health
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "Não encontrei o endereço do Worker no resultado do deploy"; exit 1; }
          echo "A verificar $url/api/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$url/api/health"
