name: Deploy (Cloudflare)
# Só corre quando o pedes (Actions > Deploy (Cloudflare) > Run workflow), nunca sozinho.
on:
  workflow_dispatch:
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        shell: bash # com pipefail: se o deploy falhar, o passo falha mesmo com o tee
        run: npm run deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Confirma que o Worker publicado responde (o objeto pode demorar uns segundos a arrancar).
      - name: Verificar /api/health
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "Não encontrei o endereço do Worker no resultado do deploy"; exit 1; }
          echo "A verificar $url/api/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$url/api/health"
