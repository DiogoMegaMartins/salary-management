name: Deploy (Cloudflare)
# Arranca sozinho quando o CI da main acaba com sucesso (depois do merge de um PR) e também à mão
# (Actions > Deploy (Cloudflare) > Run workflow). Em ambos os casos espera pela tua aprovação: o job usa o
# ambiente "production", que tem de ter "Required reviewers" (Settings > Environments > production).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    # automático só quando o CI da main passou num push (merge); nunca para PRs nem CI falhado
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://salary-management.private-finances.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          # publica exatamente o commit que o CI validou (no arranque manual, o último da branch escolhida)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        shell: bash # com pipefail: se o deploy falhar, o passo falha mesmo com o tee
        run: npm run deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Confirma que o Worker publicado responde (o objeto pode demorar uns segundos a arrancar).
      - name: Verificar /api/health
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "Não encontrei o endereço do Worker no resultado do deploy"; exit 1; }
          echo "A verificar $url/api/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$url/api/health"
